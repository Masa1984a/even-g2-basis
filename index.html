<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Basis DRR</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      background: #0d1117; color: #c9d1d9;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
    #status {
      margin: 0 0 10px; padding: 6px 8px;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      font-size: 12px; color: #8b949e; word-break: break-word;
    }
    #log {
      list-style: none; margin: 0; padding: 0;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #log li {
      padding: 4px 6px; border-bottom: 1px solid #21262d;
      word-break: break-word; white-space: pre-wrap;
    }
    #log li.ok    { color: #56d364; }
    #log li.warn  { color: #e3b341; }
    #log li.error { color: #f85149; }
    .hint { margin: 10px 0 6px; font-size: 11px; color: #6e7681; }
  </style>
</head>
<body>
  <h1>Basis DRR — G2</h1>
  <div id="status">初期化中…</div>
  <p class="hint">グラス側の操作: 全資産グラフ → BTC → ETH → PAXG → SOL をタップで巡回 / 上下スワイプ=前後 / ダブルタップ=全資産グラフでは終了、資産別では全資産へ戻る</p>
  <ul id="log"></ul>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
